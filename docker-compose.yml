# Local stack: DynamoDB Local + the API + the Nginx-served frontend.
# Both images build from the repo root (npm workspaces keeps one lockfile there).
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: movies-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: movies-api
    environment:
      NODE_ENV: production
      PORT: "3000"
      TABLE_NAME: MoviesApp
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    ports:
      - "3000:3000"
    depends_on:
      - dynamodb-local

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: movies-web
    # The ALB does path routing in AWS; locally this config gives the web
    # container the same /api/* -> API behaviour so http://localhost:8080 works.
    volumes:
      - ./apps/web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
